<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabularium — Tasks</title>
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        .task-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            margin-bottom: 14px;
            overflow: hidden;
        }
        .task-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            cursor: pointer;
        }
        .task-header:hover { background: rgba(255,255,255,0.02); }
        .task-chevron { margin-left: auto; color: var(--text-muted); transition: transform 0.2s; font-size: 11px; }
        .task-card.open .task-chevron { transform: rotate(90deg); }
        .task-steps {
            display: none;
            border-top: 1px solid var(--border-subtle);
            padding: 12px 18px;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 2;
            color: var(--text-secondary);
            max-height: 300px;
            overflow-y: auto;
        }
        .task-card.open .task-steps { display: block; }
        .status-badge {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 3px 10px;
            border-radius: 10px;
            border: 1px solid;
            font-family: var(--font-mono);
            white-space: nowrap;
        }
        .st-running { color: var(--accent); border-color: var(--accent); }
        .st-running .spin { display: inline-block; animation: rot 1s linear infinite; }
        @keyframes rot { to { transform: rotate(360deg); } }
        .st-success { color: var(--success); border-color: var(--success); }
        .st-error { color: var(--danger); border-color: var(--danger); }
        .task-del {
            background: none; border: 1px solid var(--border-subtle); color: var(--text-muted);
            border-radius: var(--radius-sm); cursor: pointer; font-size: 11px; padding: 4px 10px;
            font-family: var(--font-body);
        }
        .task-del:hover { border-color: var(--danger); color: var(--danger); }
    </style>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
</head>
<body>
    <div id="app"></div>

    <script src="/js/auth.js"></script>
    <script src="/js/layout.js"></script>
    <script>
        checkAuth();
        loadLayout('tasks');

        const mainContent = document.querySelector('.main-content');
        let expanded = new Set();

        async function loadTasks() {
            const res = await apiFetch('/api/tasks');
            if (!res || !res.ok) {
                mainContent.innerHTML = `<div style="padding:60px;text-align:center;color:var(--danger);">Erro ao carregar tasks</div>`;
                return;
            }
            const tasks = await res.json();
            const running = tasks.filter(t => t.status === 'running').length;

            const rows = tasks.length > 0 ? tasks.map(t => {
                const isRunning = t.status === 'running';
                const stClass = isRunning ? 'st-running' : t.status === 'success' ? 'st-success' : 'st-error';
                const stLabel = isRunning ? '<span class="spin">◌</span> Executando' : t.status === 'success' ? '✓ Sucesso' : '✗ Erro';
                const stColor = isRunning ? 'var(--accent)' : t.status === 'success' ? 'var(--success)' : 'var(--danger)';
                const r = t.result || {};
                const isOpen = expanded.has(t.id);
                const lastMsg = t.steps.length > 0 ? t.steps[t.steps.length - 1].message : '—';
                return `<div class="task-card${isOpen ? ' open' : ''}" id="task-${t.id}">
                    <div class="task-header" onclick="toggleTask('${t.id}')">
                        <span class="status-badge ${stClass}">${stLabel}</span>
                        <div>
                            <div style="font-weight:600;color:var(--text-primary);">${t.hostname}</div>
                            <div style="font-size:11px;color:var(--text-secondary);font-family:var(--font-mono);">
                                ${new Date(t.created_at).toLocaleString('pt-BR')} · ${isRunning ? lastMsg : (r.install_label || t.error || '—')}
                            </div>
                        </div>
                        <span style="margin-left:auto;display:flex;align-items:center;gap:10px;">
                            ${r.found != null ? `<span style="font-size:12px;color:var(--text-secondary);font-family:var(--font-mono);">${r.found} update(s)</span>` : ''}
                            ${r.rebootRequired ? '<span class="status-badge" style="color:var(--warning);border-color:var(--warning);">Reboot</span>' : ''}
                            ${!isRunning ? `<button class="task-del" onclick="delTask(event, '${t.id}')">✕</button>` : ''}
                            <span class="task-chevron">▶</span>
                        </span>
                    </div>
                    <div class="task-steps">${t.steps.map(s => `<div><span style="color:var(--text-muted);">${new Date(s.at).toLocaleTimeString('pt-BR')}</span> ${s.message.startsWith('✓') ? '<span style="color:var(--success);">' : s.message.startsWith('✗') ? '<span style="color:var(--danger);">' : s.message.startsWith('⚠') ? '<span style="color:var(--warning);">' : '<span>'}${s.message}</span></div>`).join('')}${t.error ? `<div style="color:var(--danger);">✗ ${t.error}</div>` : ''}</div>
                </div>`;
            }).join('') : `<div class="panel animate-in"><div class="panel-body" style="text-align:center;padding:40px;color:var(--text-muted);">Nenhuma task ainda. Inicie uma instalação em Patch Compliance → botão ⬆ Update.</div></div>`;

            mainContent.innerHTML = `
            <div class="page-header">
                <div>
                    <h1>⚙ Tasks</h1>
                    <p class="page-subtitle">Instalações remotas de updates em andamento — atualiza automaticamente ${running > 0 ? `· <span style="color:var(--accent);">${running} em execução</span>` : ''}</p>
                </div>
            </div>
            <div class="page-body">${rows}</div>`;
        }

        function toggleTask(id) {
            expanded.has(id) ? expanded.delete(id) : expanded.add(id);
            document.getElementById('task-' + id).classList.toggle('open');
        }

        async function delTask(ev, id) {
            ev.stopPropagation();
            const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE', headers: { ...authHeaders() } });
            if (res.ok) loadTasks();
        }

        loadTasks();
        setInterval(loadTasks, 4000);
    </script>
</body>
</html>
