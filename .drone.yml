kind: pipeline
type: docker
name: deploy

node:
  location: wir-hub

trigger:
  branch:
    - main
  event:
    - push

steps:
  - name: deploy
    image: docker:cli
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: apps
        path: /opt/infra/apps
      - name: site
        path: /opt/infra/infra/sites/tabularium-site
      - name: hostssh
        path: /mnt/hostssh
    commands:
      - apk add --no-cache git openssh-client
      - mkdir -p /root/.ssh && chmod 700 /root/.ssh
      - cp /mnt/hostssh/id_ed25519_tabularium /root/.ssh/
      - cp /mnt/hostssh/config /root/.ssh/
      - chmod 600 /root/.ssh/id_ed25519_tabularium /root/.ssh/config
      - ssh-keyscan -t rsa github.com >> /root/.ssh/known_hosts 2>/dev/null
      - git config --global --add safe.directory /opt/infra/apps/tabularium
      - cd /opt/infra/apps/tabularium && git pull origin main
      - cd /opt/infra/infra/sites/tabularium-site && docker compose up -d --build --pull always
      - docker image prune -f

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
  - name: apps
    host:
      path: /opt/infra/apps
  - name: site
    host:
      path: /opt/infra/infra/sites/tabularium-site
  - name: hostssh
    host:
      path: /home/accept/.ssh
