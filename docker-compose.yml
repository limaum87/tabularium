version: "3.8"

services:
  # ---- MySQL ----
  mysql:
    image: mysql:8.0
    container_name: tabularium-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tabularium-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- FastAPI Backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tabularium-backend
    restart: unless-stopped
    ports:
      - "8091:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_SECRET_KEY: ${API_SECRET_KEY}
      API_DEBUG: ${API_DEBUG}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COLLECTOR_API_TOKEN: ${COLLECTOR_API_TOKEN}
      DNS_SERVERS: ${DNS_SERVERS:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tabularium-net

  # ---- Frontend ----
  frontend:
    image: nginx:alpine
    container_name: tabularium-frontend
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - tabularium-net

  # ---- Collector ----
  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: tabularium-collector
    restart: unless-stopped
    environment:
      COLLECTOR_API_URL: http://backend:8000
      COLLECTOR_API_TOKEN: ${COLLECTOR_API_TOKEN}
      DNS_SERVERS: ${DNS_SERVERS:-}
    depends_on:
      - backend
    networks:
      - tabularium-net
    profiles:
      - collector

volumes:
  mysql_data:

networks:
  tabularium-net:
    driver: bridge
