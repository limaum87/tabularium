<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabularium — Configurações</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
    <div id="app"></div>

    <script src="/js/auth.js"></script>
    <script src="/js/layout.js"></script>
    <script>
        checkAuth();
        loadLayout('settings');

        const mainContent = document.querySelector('.main-content');

        async function loadSettings() {
            mainContent.innerHTML = `
            <div class="page-header">
                <h1>Configurações</h1>
                <p class="page-subtitle">Conexão com Active Directory e WinRM</p>
            </div>
            <div class="page-body">
                <!-- LDAP / AD -->
                <div class="panel animate-in" style="margin-bottom:20px;">
                    <div class="panel-header">
                        <span class="panel-title">Active Directory (LDAP)</span>
                        <button class="btn-primary-accent" onclick="saveAndTestLdap()" id="btn-ldap-test" style="padding:8px 18px;font-size:12px;">Salvar & Testar Conexão</button>
                    </div>
                    <div class="panel-body" style="padding:24px;">
                        <div id="ldap-alert"></div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                            <div>
                                <label class="form-label-dark">Servidor LDAP</label>
                                <input type="text" class="form-control-dark" id="ad-server" placeholder="ldap://dc01.empresa.local">
                            </div>
                            <div>
                                <label class="form-label-dark">Bind DN</label>
                                <input type="text" class="form-control-dark" id="ad-bind-dn" placeholder="CN=tabularium,OU=ServiceAccounts,DC=empresa,DC=local">
                            </div>
                            <div>
                                <label class="form-label-dark">Senha</label>
                                <input type="password" class="form-control-dark" id="ad-password" placeholder="Senha da conta de serviço">
                            </div>
                            <div>
                                <label class="form-label-dark">Base DN</label>
                                <input type="text" class="form-control-dark" id="ad-base-dn" placeholder="DC=empresa,DC=local">
                            </div>
                            <div>
                                <label class="form-label-dark">Filtro de Busca</label>
                                <input type="text" class="form-control-dark" id="ad-filter" placeholder="(objectClass=computer)">
                            </div>
                            <div>
                                <label class="form-label-dark">OUs (separadas por ;)</label>
                                <input type="text" class="form-control-dark" id="ad-ous" placeholder="OU=Computadores,DC=empresa,DC=local">
                            </div>
                            <div>
                                <label class="form-label-dark">Auto-importar novos hosts</label>
                                <select class="form-control-dark" id="ad-auto-import">
                                    <option value="true">Sim — importar automaticamente</option>
                                    <option value="false">Não — só detectar</option>
                                </select>
                            </div>
                        </div>
                        <div id="ldap-result" style="margin-top:16px;display:none;"></div>
                    </div>
                </div>

                <!-- WinRM -->
                <div class="panel animate-in animate-in-delay-1" style="margin-bottom:20px;">
                    <div class="panel-header">
                        <span class="panel-title">WinRM (Coleta Remota Windows)</span>
                        <button class="btn-primary-accent" onclick="saveAndTestWinrm()" id="btn-winrm-test" style="padding:8px 18px;font-size:12px;">Salvar & Testar</button>
                    </div>
                    <div class="panel-body" style="padding:24px;">
                        <div id="winrm-alert"></div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                            <div>
                                <label class="form-label-dark">Usuário WinRM</label>
                                <input type="text" class="form-control-dark" id="winrm-user" placeholder="empresa\\tabularium">
                            </div>
                            <div>
                                <label class="form-label-dark">Senha WinRM</label>
                                <input type="password" class="form-control-dark" id="winrm-password" placeholder="Senha">
                            </div>
                            <div>
                                <label class="form-label-dark">Esquema</label>
                                <select class="form-control-dark" id="winrm-scheme">
                                    <option value="http">HTTP (porta 5985)</option>
                                    <option value="https">HTTPS (porta 5986)</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label-dark">Porta</label>
                                <input type="number" class="form-control-dark" id="winrm-port" value="5985">
                            </div>
                            <div>
                                <label class="form-label-dark">Timeout (segundos)</label>
                                <input type="number" class="form-control-dark" id="winrm-timeout" value="30">
                            </div>
                            <div>
                                <label class="form-label-dark">Host para Teste</label>
                                <input type="text" class="form-control-dark" id="winrm-test-host" placeholder="HOST-NAME de uma máquina para testar">
                            </div>
                        </div>
                        <div id="winrm-result" style="margin-top:16px;display:none;"></div>
                    </div>
                </div>

                <!-- SSH / Linux -->
                <div class="panel animate-in animate-in-delay-1" style="margin-bottom:20px;">
                    <div class="panel-header">
                        <span class="panel-title">🐧 SSH (Coleta Remota Linux)</span>
                        <button class="btn-primary-accent" onclick="saveAndTestSsh()" id="btn-ssh-test" style="padding:8px 18px;font-size:12px;">Salvar & Testar</button>
                    </div>
                    <div class="panel-body" style="padding:24px;">
                        <div id="ssh-alert"></div>
                        <p style="font-size:12px;color:var(--text-muted);margin-bottom:16px;">
                            Configure a chave privada SSH para coletar dados de hardware e distro dos servidores Linux. A chave deve estar no formato PEM (RSA ou Ed25519).
                        </p>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                            <div>
                                <label class="form-label-dark">Usuário SSH</label>
                                <input type="text" class="form-control-dark" id="ssh-user" placeholder="root" value="root">
                            </div>
                            <div>
                                <label class="form-label-dark">Porta SSH</label>
                                <input type="number" class="form-control-dark" id="ssh-port" value="22">
                            </div>
                            <div>
                                <label class="form-label-dark">Timeout (segundos)</label>
                                <input type="number" class="form-control-dark" id="ssh-timeout" value="15">
                            </div>
                            <div>
                                <label class="form-label-dark">Passphrase da Chave (opcional)</label>
                                <input type="password" class="form-control-dark" id="ssh-key-passphrase" placeholder="Deixe vazio se não tiver">
                            </div>
                            <div style="grid-column:1/-1;">
                                <label class="form-label-dark">Chave Privada SSH (formato PEM)</label>
                                <textarea class="form-control-dark" id="ssh-private-key" rows="6" placeholder="-----BEGIN RSA PRIVATE KEY-----
...
-----END RSA PRIVATE KEY-----" style="font-family:var(--font-mono);font-size:11px;resize:vertical;"></textarea>
                            </div>
                            <div style="grid-column:1/-1;">
                                <label class="form-label-dark">Host Linux para Teste</label>
                                <input type="text" class="form-control-dark" id="ssh-test-host" placeholder="IP ou hostname de um servidor Linux">
                            </div>
                        </div>
                        <div id="ssh-result" style="margin-top:16px;display:none;"></div>
                    </div>
                </div>

                <!-- DNS -->
                <div class="panel animate-in" style="margin-bottom:20px;">
                    <div class="panel-header">
                        <span class="panel-title">📡 Rede — Network Discovery (Linux)</span>
                        <button class="btn-primary-accent" onclick="saveNetwork()" style="padding:8px 18px;font-size:12px;">Salvar</button>
                    </div>
                    <div class="panel-body" style="padding:24px;">
                        <div id="network-alert"></div>
                        <p style="font-size:12px;color:var(--text-muted);margin-bottom:16px;">
                            Configure as sub-redes para o Network Discovery. O scanner varre cada IP tentando conectar na porta SSH (22). Se a porta responde e lê o banner SSH, a máquina é identificada como Linux. Use formato CIDR, ex: <code style="font-family:var(--font-mono);font-size:11px;background:var(--accent-dim);padding:1px 4px;border-radius:3px;">192.168.1.0/24</code>
                        </p>
                        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
                            <div style="grid-column:1/-1;">
                                <label class="form-label-dark">Sub-redes (separadas por ;)</label>
                                <input type="text" class="form-control-dark" id="net-subnets" placeholder="192.168.1.0/24; 10.0.0.0/24">
                            </div>
                            <div>
                                <label class="form-label-dark">Porta SSH</label>
                                <input type="number" class="form-control-dark" id="net-ssh-port" value="22">
                            </div>
                            <div>
                                <label class="form-label-dark">Timeout (segundos)</label>
                                <input type="number" class="form-control-dark" id="net-timeout" value="2" min="1" max="10">
                            </div>
                            <div>
                                <label class="form-label-dark">Workers (paralelismo)</label>
                                <input type="number" class="form-control-dark" id="net-workers" value="100" min="10" max="500">
                            </div>
                            <div>
                                <label class="form-label-dark">Auto-importar novos hosts</label>
                                <select class="form-control-dark" id="net-auto-import">
                                    <option value="true">Sim — importar automaticamente</option>
                                    <option value="false">Não — só detectar</option>
                                </select>
                            </div>
                            <div style="grid-column:1/-1;">
                                <label class="form-label-dark">IPs para excluir (separados por ;)</label>
                                <input type="text" class="form-control-dark" id="net-exclude" placeholder="192.168.1.1; 192.168.1.254">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- DNS -->
                <div class="panel animate-in" style="margin-bottom:20px;">
                    <div class="panel-header">
                        <span class="panel-title">DNS (Resolução de Nomes)</span>
                        <div style="display:flex;gap:8px;">
                            <button class="btn-primary-accent" onclick="testDns()" id="btn-dns-test" style="padding:8px 18px;font-size:12px;">Testar DNS</button>
                            <button class="btn-primary-accent" onclick="saveAndApplyDns()" id="btn-dns-apply" style="padding:8px 18px;font-size:12px;">Salvar & Aplicar</button>
                        </div>
                    </div>
                    <div class="panel-body" style="padding:24px;">
                        <div id="dns-alert"></div>
                        <p style="font-size:12px;color:var(--text-muted);margin-bottom:16px;">
                            Configure o servidor DNS da sua rede corporativa para que os containers consigam resolver nomes como <code style="font-family:var(--font-mono);font-size:11px;background:var(--accent-dim);padding:1px 4px;border-radius:3px;">wir-adm-01</code>. Use o IP do controlador de domínio AD. Para mais de um DNS, separe por vírgula.
                        </p>
                        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
                            <div>
                                <label class="form-label-dark">Servidor DNS</label>
                                <input type="text" class="form-control-dark" id="dns-servers" placeholder="10.0.0.1 ou 10.0.0.1,10.0.0.2">
                            </div>
                            <div>
                                <label class="form-label-dark">Domínio de Busca (Search)</label>
                                <input type="text" class="form-control-dark" id="dns-search" placeholder="empresa.local">
                            </div>
                            <div>
                                <label class="form-label-dark">Host para Teste</label>
                                <input type="text" class="form-control-dark" id="dns-test-host" placeholder="wir-adm-01">
                            </div>
                        </div>
                        <div id="dns-result" style="margin-top:16px;display:none;"></div>
                    </div>
                </div>

                <!-- Agendamento -->
                <div class="panel animate-in animate-in-delay-2" style="margin-bottom:20px;">
                    <div class="panel-header">
                        <span class="panel-title">⏱ Agendamento do Collector</span>
                        <button class="btn-primary-accent" onclick="saveSchedule()" style="padding:8px 18px;font-size:12px;">Salvar</button>
                    </div>
                    <div class="panel-body" style="padding:24px;">
                        <div id="schedule-alert"></div>
                        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
                            <div>
                                <label class="form-label-dark">Coleta Automática</label>
                                <select class="form-control-dark" id="schedule-enabled">
                                    <option value="true">Habilitada</option>
                                    <option value="false">Desabilitada</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label-dark">Intervalo de Coleta (horas)</label>
                                <input type="number" class="form-control-dark" id="schedule-interval" value="6" min="1" max="168">
                            </div>
                            <div>
                                <label class="form-label-dark">Ping Timeout (segundos)</label>
                                <input type="number" class="form-control-dark" id="ping-timeout" value="3" min="1" max="30">
                            </div>
                        </div>
                        <div id="schedule-status" style="margin-top:12px;font-size:12px;color:var(--text-muted);font-family:var(--font-mono);"></div>
                    </div>
                </div>

                <!-- API Keys -->
                <div class="panel animate-in animate-in-delay-2" style="margin-bottom:20px;">
                    <div class="panel-header">
                        <span class="panel-title">🔑 API Keys (Agentes de IA / Integrações)</span>
                        <button class="btn-primary-accent" onclick="createApiKey()" style="padding:8px 18px;font-size:12px;">+ Nova API Key</button>
                    </div>
                    <div class="panel-body" style="padding:24px;">
                        <div style="font-size:12px;color:var(--text-muted);margin-bottom:16px;">
                            Permite que agentes de IA consultem os dados da frota via <code style="font-family:var(--font-mono);background:var(--accent-dim);padding:1px 4px;border-radius:3px;">X-API-Key</code> (acesso somente leitura). A chave é exibida <strong style="color:var(--text-primary);">apenas uma vez</strong> no momento da criação.
                        </div>
                        <div id="apikeys-alert"></div>
                        <div id="apikeys-list"></div>
                    </div>
                </div>
            </div>
            `;

            // Carregar configurações salvas
            const res = await apiFetch('/api/settings');
            if (res && res.ok) {
                const data = await res.json();

                // AD
                if (data.ad) {
                    if (data.ad.server) document.getElementById('ad-server').value = data.ad.server;
                    if (data.ad.bind_dn) document.getElementById('ad-bind-dn').value = data.ad.bind_dn;
                    if (data.ad.password) document.getElementById('ad-password').value = data.ad.password;
                    if (data.ad.base_dn) document.getElementById('ad-base-dn').value = data.ad.base_dn;
                    if (data.ad.search_filter) document.getElementById('ad-filter').value = data.ad.search_filter;
                    if (data.ad.ou_list) document.getElementById('ad-ous').value = Array.isArray(data.ad.ou_list) ? data.ad.ou_list.join('; ') : data.ad.ou_list;
                    if (data.ad.auto_import) document.getElementById('ad-auto-import').value = data.ad.auto_import;
                }

                // WinRM
                if (data.winrm) {
                    if (data.winrm.username) document.getElementById('winrm-user').value = data.winrm.username;
                    if (data.winrm.password) document.getElementById('winrm-password').value = data.winrm.password;
                    if (data.winrm.scheme) document.getElementById('winrm-scheme').value = data.winrm.scheme;
                    if (data.winrm.port) document.getElementById('winrm-port').value = data.winrm.port;
                    if (data.winrm.timeout) document.getElementById('winrm-timeout').value = data.winrm.timeout;
                }

                // Schedule
                if (data.schedule) {
                    if (data.schedule.interval_hours) document.getElementById('schedule-interval').value = data.schedule.interval_hours;
                    if (data.schedule.enabled !== undefined) document.getElementById('schedule-enabled').value = String(data.schedule.enabled);
                }
                if (data.ping) {
                    if (data.ping.timeout) document.getElementById('ping-timeout').value = data.ping.timeout;
                }

                // DNS
                if (data.dns) {
                    if (data.dns.servers) document.getElementById('dns-servers').value = data.dns.servers;
                    if (data.dns.search_domain) document.getElementById('dns-search').value = data.dns.search_domain;
                }

                // SSH
                if (data.ssh) {
                    if (data.ssh.username) document.getElementById('ssh-user').value = data.ssh.username;
                    if (data.ssh.port) document.getElementById('ssh-port').value = data.ssh.port;
                    if (data.ssh.timeout) document.getElementById('ssh-timeout').value = data.ssh.timeout;
                    if (data.ssh.private_key) document.getElementById('ssh-private-key').value = data.ssh.private_key;
                    if (data.ssh.key_passphrase) document.getElementById('ssh-key-passphrase').value = data.ssh.key_passphrase;
                }

                // Network
                if (data.network) {
                    if (data.network.subnets) {
                        try {
                            const subs = JSON.parse(data.network.subnets);
                            document.getElementById('net-subnets').value = Array.isArray(subs) ? subs.join('; ') : subs;
                        } catch(e) {
                            document.getElementById('net-subnets').value = data.network.subnets;
                        }
                    }
                    if (data.network.ssh_port) document.getElementById('net-ssh-port').value = data.network.ssh_port;
                    if (data.network.timeout) document.getElementById('net-timeout').value = data.network.timeout;
                    if (data.network.max_workers) document.getElementById('net-workers').value = data.network.max_workers;
                    if (data.network.exclude_ips) {
                        try {
                            const exc = JSON.parse(data.network.exclude_ips);
                            document.getElementById('net-exclude').value = Array.isArray(exc) ? exc.join('; ') : exc;
                        } catch(e) {
                            document.getElementById('net-exclude').value = data.network.exclude_ips;
                        }
                    }
                    if (data.network.auto_import) document.getElementById('net-auto-import').value = data.network.auto_import;
                }
            }
        }

        function alertBox(id, success, message) {
            const el = document.getElementById(id);
            el.style.display = 'block';
            el.style.padding = '12px 16px';
            el.style.borderRadius = 'var(--radius-sm)';
            el.style.fontSize = '13px';
            el.style.border = '1px solid';
            if (success) {
                el.style.background = 'var(--success-dim)';
                el.style.borderColor = 'rgba(52, 211, 153, 0.2)';
                el.style.color = 'var(--success)';
            } else {
                el.style.background = 'var(--danger-dim)';
                el.style.borderColor = 'rgba(248, 113, 113, 0.2)';
                el.style.color = 'var(--danger)';
            }
            el.innerHTML = message;
        }

        async function saveSettingsBatch(settings) {
            return apiFetch('/api/settings', {
                method: 'PUT',
                body: { settings },
            });
        }

        async function saveAndTestLdap() {
            const btn = document.getElementById('btn-ldap-test');
            btn.disabled = true;
            btn.textContent = 'Testando...';

            const server = document.getElementById('ad-server').value;
            const bind_dn = document.getElementById('ad-bind-dn').value;
            const password = document.getElementById('ad-password').value;
            const base_dn = document.getElementById('ad-base-dn').value;
            const search_filter = document.getElementById('ad-filter').value || '(objectClass=computer)';
            const ous_raw = document.getElementById('ad-ous').value;
            const ou_list = ous_raw ? ous_raw.split(';').map(s => s.trim()).filter(Boolean) : [];

            // Salvar
            await saveSettingsBatch([
                { key: 'server', value: server, category: 'ad' },
                { key: 'bind_dn', value: bind_dn, category: 'ad' },
                { key: 'password', value: password, category: 'ad' },
                { key: 'base_dn', value: base_dn, category: 'ad' },
                { key: 'search_filter', value: search_filter, category: 'ad' },
                { key: 'ou_list', value: JSON.stringify(ou_list), category: 'ad' },
                { key: 'auto_import', value: document.getElementById('ad-auto-import').value, category: 'ad' },
            ]);

            // Testar
            const res = await apiFetch('/api/settings/test-ldap', {
                method: 'POST',
                body: { server, bind_dn, password, base_dn, search_filter },
            });

            if (res) {
                const data = await res.json();
                if (data.success) {
                    let previewHtml = '';
                    if (data.preview && data.preview.length > 0) {
                        previewHtml = `<div style="margin-top:12px;"><span style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;">Primeiros ${data.preview.length} computadores:</span><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">${data.preview.map(h => `<span style="font-family:var(--font-mono);font-size:11px;padding:3px 8px;background:var(--accent-dim);color:var(--accent);border-radius:4px;">${h}</span>`).join('')}</div></div>`;
                    }
                    alertBox('ldap-result', true, `✓ ${data.message}${previewHtml}`);
                } else {
                    alertBox('ldap-result', false, `✗ ${data.message}`);
                }
            }

            btn.disabled = false;
            btn.textContent = 'Salvar & Testar Conexão';
        }

        async function saveAndTestWinrm() {
            const btn = document.getElementById('btn-winrm-test');
            btn.disabled = true;
            btn.textContent = 'Testando...';

            const username = document.getElementById('winrm-user').value;
            const password = document.getElementById('winrm-password').value;
            const scheme = document.getElementById('winrm-scheme').value;
            const port = parseInt(document.getElementById('winrm-port').value) || 5985;
            const timeout = parseInt(document.getElementById('winrm-timeout').value) || 30;
            const testHost = document.getElementById('winrm-test-host').value;

            // Salvar
            await saveSettingsBatch([
                { key: 'username', value: username, category: 'winrm' },
                { key: 'password', value: password, category: 'winrm' },
                { key: 'scheme', value: scheme, category: 'winrm' },
                { key: 'port', value: String(port), category: 'winrm' },
                { key: 'timeout', value: String(timeout), category: 'winrm' },
            ]);

            if (!testHost) {
                alertBox('winrm-result', true, '✓ Configurações do WinRM salvas. Informe um host para testar.');
                btn.disabled = false;
                btn.textContent = 'Salvar & Testar';
                return;
            }

            // Testar
            const res = await apiFetch('/api/settings/test-winrm', {
                method: 'POST',
                body: { hostname: testHost, username, password, scheme, port },
            });

            if (res) {
                const data = await res.json();
                if (data.success) {
                    alertBox('winrm-result', true, `✓ ${data.message}`);
                } else {
                    alertBox('winrm-result', false, `✗ ${data.message}`);
                }
            }

            btn.disabled = false;
            btn.textContent = 'Salvar & Testar';
        }

        async function saveAndTestSsh() {
            const btn = document.getElementById('btn-ssh-test');
            btn.disabled = true;
            btn.textContent = 'Testando...';

            const username = document.getElementById('ssh-user').value;
            const port = parseInt(document.getElementById('ssh-port').value) || 22;
            const timeout = parseInt(document.getElementById('ssh-timeout').value) || 15;
            const privateKey = document.getElementById('ssh-private-key').value;
            const keyPassphrase = document.getElementById('ssh-key-passphrase').value;
            const testHost = document.getElementById('ssh-test-host').value;

            // Salvar
            await saveSettingsBatch([
                { key: 'username', value: username, category: 'ssh' },
                { key: 'port', value: String(port), category: 'ssh' },
                { key: 'timeout', value: String(timeout), category: 'ssh' },
                { key: 'private_key', value: privateKey, category: 'ssh' },
                { key: 'key_passphrase', value: keyPassphrase, category: 'ssh' },
            ]);

            if (!testHost) {
                alertBox('ssh-result', true, '✓ Configurações SSH salvas. Informe um host para testar.');
                btn.disabled = false;
                btn.textContent = 'Salvar & Testar';
                return;
            }

            if (!privateKey) {
                alertBox('ssh-result', false, '✗ Informe a chave privada para testar.');
                btn.disabled = false;
                btn.textContent = 'Salvar & Testar';
                return;
            }

            // Testar
            const res = await apiFetch('/api/settings/test-ssh', {
                method: 'POST',
                body: { hostname: testHost, username, private_key: privateKey, key_passphrase: keyPassphrase, port },
            });

            if (res) {
                const data = await res.json();
                if (data.success) {
                    alertBox('ssh-result', true, `✓ ${data.message}`);
                } else {
                    alertBox('ssh-result', false, `✗ ${data.message}`);
                }
            }

            btn.disabled = false;
            btn.textContent = 'Salvar & Testar';
        }

        async function saveAndApplyDns() {
            const btn = document.getElementById('btn-dns-apply');
            btn.disabled = true;
            btn.textContent = 'Aplicando...';

            const dnsServers = document.getElementById('dns-servers').value.trim();
            const searchDomain = document.getElementById('dns-search').value.trim();

            // Salvar no banco
            await saveSettingsBatch([
                { key: 'servers', value: dnsServers, category: 'dns' },
                { key: 'search_domain', value: searchDomain, category: 'dns' },
            ]);

            if (!dnsServers) {
                alertBox('dns-result', true, '✓ Configuração de DNS removida. Reinicie o container para voltar ao DNS padrão.');
                btn.disabled = false;
                btn.textContent = 'Salvar & Aplicar';
                return;
            }

            // Aplicar no container em runtime
            const res = await apiFetch('/api/settings/apply-dns', {
                method: 'POST',
                body: { dns_servers: dnsServers, search_domain: searchDomain },
            });

            if (res) {
                const data = await res.json();
                if (data.success) {
                    alertBox('dns-result', true, `✓ ${data.message}. O DNS já está ativo neste container.`);
                } else {
                    alertBox('dns-result', false, `✗ ${data.message}`);
                }
            }

            btn.disabled = false;
            btn.textContent = 'Salvar & Aplicar';
        }

        async function testDns() {
            const btn = document.getElementById('btn-dns-test');
            btn.disabled = true;
            btn.textContent = 'Testando...';

            const testHost = document.getElementById('dns-test-host').value.trim();
            if (!testHost) {
                alertBox('dns-result', false, '✗ Informe um hostname para testar');
                btn.disabled = false;
                btn.textContent = 'Testar DNS';
                return;
            }

            const res = await apiFetch('/api/settings/test-dns', {
                method: 'POST',
                body: { hostname: testHost },
            });

            if (res) {
                const data = await res.json();
                let resolvHtml = '';
                if (data.resolv_conf) {
                    resolvHtml = `<div style="margin-top:8px;"><span style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;">resolv.conf atual:</span><pre style="font-family:var(--font-mono);font-size:11px;background:var(--bg-dark,#1a1a2e);padding:8px;border-radius:4px;margin-top:4px;color:var(--text-muted);">${data.resolv_conf}</pre></div>`;
                }
                if (data.success) {
                    alertBox('dns-result', true, `✓ ${data.message}${resolvHtml}`);
                } else {
                    alertBox('dns-result', false, `✗ ${data.message}${resolvHtml}`);
                }
            }

            btn.disabled = false;
            btn.textContent = 'Testar DNS';
        }

        async function saveSchedule() {
            const interval = parseInt(document.getElementById('schedule-interval').value) || 6;
            const pingTimeout = parseInt(document.getElementById('ping-timeout').value) || 3;
            const enabled = document.getElementById('schedule-enabled').value;

            await saveSettingsBatch([
                { key: 'interval_hours', value: String(interval), category: 'schedule' },
                { key: 'enabled', value: enabled, category: 'schedule' },
                { key: 'timeout', value: String(pingTimeout), category: 'ping' },
            ]);

            const statusMsg = enabled === 'true'
                ? `✓ Coleta automática habilitada — a cada ${interval}h`
                : '✓ Coleta automática desabilitada';
            alertBox('schedule-alert', true, statusMsg);
            setTimeout(() => { document.getElementById('schedule-alert').style.display = 'none'; }, 5000);
        }

        async function saveNetwork() {
            const subnets_raw = document.getElementById('net-subnets').value.trim();
            const sshPort = parseInt(document.getElementById('net-ssh-port').value) || 22;
            const timeout = parseInt(document.getElementById('net-timeout').value) || 2;
            const workers = parseInt(document.getElementById('net-workers').value) || 100;
            const exclude_raw = document.getElementById('net-exclude').value.trim();

            const subnets = subnets_raw ? subnets_raw.split(';').map(s => s.trim()).filter(Boolean) : [];
            const exclude_ips = exclude_raw ? exclude_raw.split(';').map(s => s.trim()).filter(Boolean) : [];
            const autoImport = document.getElementById('net-auto-import').value;

            await saveSettingsBatch([
                { key: 'subnets', value: JSON.stringify(subnets), category: 'network' },
                { key: 'ssh_port', value: String(sshPort), category: 'network' },
                { key: 'timeout', value: String(timeout), category: 'network' },
                { key: 'max_workers', value: String(workers), category: 'network' },
                { key: 'exclude_ips', value: JSON.stringify(exclude_ips), category: 'network' },
                { key: 'auto_import', value: autoImport, category: 'network' },
            ]);

            alertBox('network-alert', true, `✓ Configurações de rede salvas — ${subnets.length} sub-rede(s) configurada(s). Network Discovery automático: 1x por dia.`);
            setTimeout(() => { document.getElementById('network-alert').style.display = 'none'; }, 5000);
        }

        // Load schedule status
        async function loadScheduleStatus() {
            try {
                const el = document.getElementById('schedule-status');
                if (!el) return;

                // Busca última coleta
                const [activityRes, nextRes] = await Promise.all([
                    apiFetch('/api/activity?limit=1&type=collector_checkin'),
                    apiFetch('/api/activity/next-runs'),
                ]);

                let lines = [];

                // Última coleta
                if (activityRes && activityRes.ok) {
                    const data = await activityRes.json();
                    if (data.total > 0) {
                        const last = data.items[0];
                        const dt = last.created_at ? new Date(last.created_at).toLocaleString('pt-BR') : '—';
                        lines.push(`<span style="color:var(--success);">✓</span> Última coleta: ${dt}`);
                    } else {
                        lines.push('Nenhuma coleta automática registrada');
                    }
                }

                // Próxima execução
                if (nextRes && nextRes.ok) {
                    const nr = await nextRes.json();
                    const collect = nr.collect;
                    const now = new Date(nr.now);

                    if (collect.status === 'running' && collect.next_at) {
                        const target = new Date(collect.next_at);
                        const diff = Math.floor((target - now) / 1000);
                        let countdown;
                        if (diff <= 0) countdown = 'agora...';
                        else if (diff < 60) countdown = `${diff}s`;
                        else if (diff < 3600) countdown = `${Math.floor(diff/60)}min`;
                        else {
                            const h = Math.floor(diff/3600);
                            const m = Math.floor((diff % 3600) / 60);
                            countdown = `${h}h${m > 0 ? ' ' + m + 'min' : ''}`;
                        }
                        const timeStr = target.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                        lines.push(`<span style="color:var(--accent);">⏱</span> Próxima coleta: <strong>${timeStr}</strong> (em ${countdown}) · ${collect.interval_label}`);
                    } else if (collect.status === 'no_credentials') {
                        lines.push(`<span style="color:var(--warning);">⚠</span> Coleta pausada — configure credenciais WinRM acima`);
                    } else {
                        lines.push(`<span style="color:var(--text-muted);">⊘</span> Coleta automática desabilitada`);
                    }
                }

                el.innerHTML = lines.join('<br>');
            } catch(e) {}
        }

        // ---- API Keys ----

        async function loadApiKeys() {
            try {
                const res = await apiFetch('/api/settings/apikeys');
                if (!res || !res.ok) return;
                const keys = await res.json();
                const el = document.getElementById('apikeys-list');
                if (!el) return;
                if (!keys.length) {
                    el.innerHTML = '<div style="font-size:12px;color:var(--text-muted);font-style:italic;">Nenhuma API key criada.</div>';
                    return;
                }
                el.innerHTML = `
                    <table style="width:100%;font-size:12px;border-collapse:collapse;">
                        <thead><tr style="text-align:left;color:var(--text-muted);border-bottom:1px solid var(--border-color);">
                            <th style="padding:8px;">Nome</th><th style="padding:8px;">Chave</th><th style="padding:8px;">Status</th><th style="padding:8px;">Último uso</th><th style="padding:8px;">Criada em</th><th style="padding:8px;"></th>
                        </tr></thead>
                        <tbody>
                        ${keys.map(k => `
                            <tr style="border-bottom:1px solid var(--border-color);">
                                <td style="padding:8px;">${esc(k.name)}</td>
                                <td style="padding:8px;font-family:var(--font-mono);">${esc(k.key_prefix)}…</td>
                                <td style="padding:8px;">${k.is_active
                                    ? '<span style="color:var(--success, #4ade80);">● Ativa</span>'
                                    : '<span style="color:var(--text-muted);">○ Inativa</span>'}</td>
                                <td style="padding:8px;">${k.last_used_at ? new Date(k.last_used_at).toLocaleString('pt-BR') : '—'}</td>
                                <td style="padding:8px;">${k.created_at ? new Date(k.created_at).toLocaleDateString('pt-BR') : '—'}</td>
                                <td style="padding:8px;text-align:right;white-space:nowrap;">
                                    <button class="btn-key-action" onclick="toggleApiKey(${k.id}, ${!k.is_active})">${k.is_active ? 'Desativar' : 'Ativar'}</button>
                                    <button class="btn-key-danger" onclick="deleteApiKey(${k.id}, '${esc(k.name).replace(/'/g, "\\'")}')">Revogar</button>
                                </td>
                            </tr>`).join('')}
                        </tbody>
                    </table>`;
            } catch(e) { console.error(e); }
        }

        function esc(s) {
            return String(s ?? '').replace(/[&<>"/]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','/':'&#47;'}[c]));
        }

        async function createApiKey() {
            const name = prompt('Nome da API key (ex: "Agente IA - Suporte"):', '');
            if (!name || !name.trim()) return;
            try {
                const res = await apiFetch('/api/settings/apikeys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name.trim() }),
                });
                const data = await res.json();
                if (!res.ok) { alert(data.detail || 'Erro ao criar API key'); return; }
                alert('API key criada! Copie agora — ela NÃO será exibida novamente:\n\n' + data.key);
                loadApiKeys();
            } catch(e) { alert('Erro ao criar API key'); }
        }

        async function toggleApiKey(id, active) {
            await apiFetch(`/api/settings/apikeys/${id}?is_active=${active}`, { method: 'PUT' });
            loadApiKeys();
        }

        async function deleteApiKey(id, name) {
            if (!confirm(`Revogar a API key "${name}"? Agentes usando ela perderão o acesso imediatamente.`)) return;
            await apiFetch(`/api/settings/apikeys/${id}`, { method: 'DELETE' });
            loadApiKeys();
        }

        // Carrega status do schedule junto com settings
        const origLoad = loadSettings;
        loadSettings = async function() {
            await origLoad();
            loadScheduleStatus();
            loadApiKeys();
            // Atualiza a cada 30s
            setInterval(loadScheduleStatus, 30000);
        };
        loadSettings();
    </script>
</body>
</html>
