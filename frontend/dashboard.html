<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabularium — Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container-fluid mt-4">
        <h2>Dashboard</h2>
        <div class="row g-3 mb-4" id="summary-cards">
            <div class="col-md-3">
                <div class="card text-bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">Total Hosts</h5>
                        <p class="card-text fs-2" id="total-hosts">—</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-bg-success">
                    <div class="card-body">
                        <h5 class="card-title">Online</h5>
                        <p class="card-text fs-2" id="online-hosts">—</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-bg-danger">
                    <div class="card-body">
                        <h5 class="card-title">Offline</h5>
                        <p class="card-text fs-2" id="offline-hosts">—</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-bg-warning">
                    <div class="card-body">
                        <h5 class="card-title">Licenças em Alerta</h5>
                        <p class="card-text fs-2" id="license-alerts">—</p>
                    </div>
                </div>
            </div>
        </div>

        <h4>Últimas Coletas</h4>
        <table id="scans-table" class="table table-striped">
            <thead>
                <tr><th>Host</th><th>Status</th><th>Concluído em</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.bootstrap5.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/layout.js"></script>
    <script>
        checkAuth();
        loadNavbar();

        (async () => {
            // Compliance
            const res = await apiFetch('/api/compliance');
            if (!res) return;
            const data = await res.json();
            document.getElementById('total-hosts').textContent = data.total_hosts;
            document.getElementById('online-hosts').textContent = data.online_hosts;
            document.getElementById('offline-hosts').textContent = data.offline_hosts;
            document.getElementById('license-alerts').textContent = (data.windows?.unlicensed || 0) + (data.office?.unlicensed || 0);

            // Últimas coletas
            const resScans = await apiFetch('/api/scans?limit=15');
            if (!resScans) return;
            const scans = await resScans.json();
            const tbody = document.querySelector('#scans-table tbody');
            scans.forEach(s => {
                tbody.innerHTML += `<tr>
                    <td>${s.hostname}</td>
                    <td><span class="badge ${s.status === 'success' ? 'bg-success' : 'bg-danger'}">${s.status}</span></td>
                    <td>${s.finished_at || '—'}</td>
                </tr>`;
            });
            $('#scans-table').DataTable({ pageLength: 10, order: [[2, 'desc']] });
        })();
    </script>
</body>
</html>
