<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabularium — Login</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body class="login-page">
    <div class="login-box">
        <div class="login-logo">
            <img src="/assets/logo.png" alt="Tabularium" style="height:64px;width:auto;border-radius:10px;margin-bottom:8px;">
            <h1>Tabularium</h1>
            <p>Inventário de ativos</p>
        </div>

        <div class="login-form">
            <div id="alert-box"></div>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label-dark" for="email">E-mail</label>
                    <input type="email" class="form-control-dark" id="email" placeholder="seu@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label-dark" for="password">Senha</label>
                    <input type="password" class="form-control-dark" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login" id="btn-login">Entrar →</button>
            </form>
        </div>

        <p style="text-align: center; margin-top: 24px; font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); letter-spacing: 0.05em;">
            TABULARIUM v0.1.0
        </p>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        const btn = document.getElementById('btn-login');
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alert-box');

            btn.disabled = true;
            btn.textContent = 'Autenticando...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });
                const data = await res.json();

                if (!res.ok) {
                    alertBox.innerHTML = `<div class="login-alert alert-error">${data.detail || 'Erro ao fazer login'}</div>`;
                    btn.disabled = false;
                    btn.textContent = 'Entrar →';
                    return;
                }

                localStorage.setItem('token', data.access_token);
                btn.textContent = '✓ Acessando...';
                window.location.href = '/dashboard.html';
            } catch (err) {
                alertBox.innerHTML = '<div class="login-alert alert-error">Erro de conexão com o servidor</div>';
                btn.disabled = false;
                btn.textContent = 'Entrar →';
            }
        });
    </script>
</body>
</html>
