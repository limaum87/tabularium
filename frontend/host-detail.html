<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabularium — Detalhe do Host</title>
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        .action-result {
            margin-top: 8px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: var(--font-mono);
            border: 1px solid;
        }
        .action-result.success {
            background: var(--success-dim);
            border-color: rgba(52, 211, 153, 0.2);
            color: var(--success);
        }
        .action-result.error {
            background: var(--danger-dim);
            border-color: rgba(248, 113, 113, 0.2);
            color: var(--danger);
        }
        .action-result.loading {
            background: rgba(255,255,255,0.03);
            border-color: var(--border-subtle);
            color: var(--text-muted);
        }
        .actions-bar {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .action-btn-detail {
            background: none;
            border: 1px solid var(--border-medium);
            color: var(--text-primary);
            font-size: 12px;
            font-family: var(--font-body);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn-detail:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }
        .action-btn-detail:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid var(--text-muted);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        /* Console */
        .collect-console {
            margin-top: 16px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono, 'Courier New', monospace);
            font-size: 12px;
            color: #c9d1d9;
            overflow: hidden;
        }
        .console-header {
            background: #161b22;
            padding: 8px 14px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #8b949e;
        }
        .console-dot { width: 8px; height: 8px; border-radius: 50%; }
        .console-body {
            padding: 12px 14px;
            max-height: 320px;
            overflow-y: auto;
            line-height: 1.7;
        }
        .console-line { white-space: pre-wrap; word-break: break-all; }
        .console-line.step { color: #58a6ff; }
        .console-line.ok { color: #3fb950; }
        .console-line.warn { color: #d29922; }
        .console-line.fail { color: #f85149; }
        .console-line.error { color: #f85149; font-weight: bold; }
        .console-line.done { color: #3fb950; font-weight: bold; padding-top: 8px; border-top: 1px solid #30363d; }
        .console-line .timestamp { color: #484f58; margin-right: 8px; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="/js/auth.js"></script>
    <script src="/js/layout.js"></script>
    <script>
        checkAuth();
        loadLayout('hosts');

        const mainContent = document.querySelector('.main-content');
        const params = new URLSearchParams(window.location.search);
        const hostId = params.get('id');

        if (!hostId) {
            window.location.href = '/hosts.html';
        }

        async function loadHost() {
            mainContent.innerHTML = `<div style="padding:60px;text-align:center;color:var(--text-muted);font-family:var(--font-mono);">Carregando...</div>`;

            const res = await apiFetch(`/api/hosts/${hostId}`);
            if (!res) return;
            const data = await res.json();
            const h = data.host;
            const hw = data.hardware || {};
            const dt = h.last_seen ? new Date(h.last_seen).toLocaleString('pt-BR') : '—';
            const badgeClass = h.status === 'online' ? 'badge-success' : h.status === 'offline' ? 'badge-danger' : 'badge-muted';

            mainContent.innerHTML = `
            <div class="page-header">
                <div style="display:flex;align-items:center;gap:16px;">
                    <a href="/hosts.html" style="color:var(--text-muted);font-size:20px;">←</a>
                    <div>
                        <h1>${h.hostname}</h1>
                        <p class="page-subtitle">${h.domain || 'Sem domínio'} · 📡 Ping: <span class="badge-status ${h.ping_status === 'online' ? 'badge-success' : h.ping_status === 'offline' ? 'badge-danger' : 'badge-muted'}">${h.ping_status || '?'}</span> · 🔌 WinRM: <span class="badge-status ${badgeClass}">${h.status}</span> · Último contato: ${dt}</p>
                    </div>
                </div>
                <div class="actions-bar">
                    <button class="action-btn-detail" onclick="runDetailAction('ping')" id="btn-ping">📡 Testar Ping</button>
                    <button class="action-btn-detail" onclick="runDetailAction('test-winrm')" id="btn-test-winrm">🔌 Testar WinRM</button>
                    <button class="action-btn-detail" onclick="runDetailAction('enable-winrm')" id="btn-enable-winrm">⚡ Ativar WinRM</button>
                    <button class="action-btn-detail" onclick="runDetailAction('collect')" id="btn-collect" style="border-color:var(--accent);color:var(--accent);">🔄 Coletar Dados</button>
                </div>
                <div id="action-result" style="display:none;"></div>
            </div>
            <div class="page-body">
                <!-- Hardware -->
                <div class="panel animate-in" style="margin-bottom:20px;">
                    <div class="panel-header"><span class="panel-title">Hardware</span></div>
                    <div class="panel-body">
                        <table class="data-table">
                            <tbody>
                                <tr><td style="width:200px;color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:0.08em;">Fabricante</td><td class="mono">${hw.manufacturer || '—'}</td></tr>
                                <tr><td style="color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:0.08em;">Modelo</td><td class="mono">${hw.model || '—'}</td></tr>
                                <tr><td style="color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:0.08em;">Serial</td><td class="mono">${hw.serial || '—'}</td></tr>
                                <tr><td style="color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:0.08em;">CPU</td><td class="mono">${hw.cpu || '—'}</td></tr>
                                <tr><td style="color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:0.08em;">RAM</td><td class="mono">${hw.ram_gb ? hw.ram_gb + ' GB' : '—'}</td></tr>
                                <tr><td style="color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:0.08em;">BIOS</td><td class="mono">${hw.bios_version || '—'}</td></tr>
                                <tr><td style="color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:0.08em;">Último Usuário</td><td class="mono">${hw.last_user || '—'}</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Discos -->
                <div class="panel animate-in animate-in-delay-1" style="margin-bottom:20px;">
                    <div class="panel-header"><span class="panel-title">Discos</span></div>
                    <div class="panel-body">
                        <table class="data-table">
                            <thead><tr><th>Drive</th><th>Total</th><th>Livre</th><th>Uso</th><th>Filesystem</th></tr></thead>
                            <tbody>
                                ${data.disks && data.disks.length > 0 ? data.disks.map(d => {
                                    const pct = d.total_gb ? ((d.total_gb - d.free_gb) / d.total_gb * 100).toFixed(0) : 0;
                                    const barColor = pct > 85 ? 'var(--danger)' : pct > 70 ? 'var(--warning)' : 'var(--success)';
                                    return `<tr>
                                        <td class="mono">${d.drive || '—'}</td>
                                        <td class="mono">${d.total_gb ? d.total_gb + ' GB' : '—'}</td>
                                        <td class="mono">${d.free_gb ? d.free_gb + ' GB' : '—'}</td>
                                        <td><div style="display:flex;align-items:center;gap:10px;">
                                            <div style="flex:1;max-width:120px;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;">
                                                <div style="width:${pct}%;height:100%;background:${barColor};border-radius:3px;transition:width 0.5s;"></div>
                                            </div>
                                            <span class="mono" style="font-size:12px;color:${barColor};">${pct}%</span>
                                        </div></td>
                                        <td>${d.filesystem || '—'}</td>
                                    </tr>`;
                                }).join('') : '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-muted)">Sem dados de disco</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Rede -->
                <div class="panel animate-in animate-in-delay-2" style="margin-bottom:20px;">
                    <div class="panel-header"><span class="panel-title">Rede</span></div>
                    <div class="panel-body">
                        <table class="data-table">
                            <thead><tr><th>Adaptador</th><th>IP</th><th>MAC</th><th>Gateway</th><th>DNS</th></tr></thead>
                            <tbody>
                                ${data.network && data.network.length > 0 ? data.network.map(n => `<tr>
                                    <td>${n.adapter_name || '—'}</td>
                                    <td class="mono">${n.ip || '—'}</td>
                                    <td class="mono" style="font-size:11px;">${n.mac || '—'}</td>
                                    <td class="mono">${n.gateway || '—'}</td>
                                    <td class="mono">${n.dns || '—'}</td>
                                </tr>`).join('') : '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-muted)">Sem dados de rede</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Licenças -->
                <div class="panel animate-in animate-in-delay-3" style="margin-bottom:20px;">
                    <div class="panel-header"><span class="panel-title">Licenças</span></div>
                    <div class="panel-body">
                        <table class="data-table">
                            <thead><tr><th>Produto</th><th>Edição / Versão</th><th>Canal</th><th>Status</th><th>Chave Parcial</th></tr></thead>
                            <tbody>
                                ${data.licenses && data.licenses.length > 0 ? data.licenses.map(l => {
                                    const lBadge = l.license_status === 'Licensed' ? 'badge-success' : l.license_status === 'Unlicensed' ? 'badge-danger' : 'badge-warning';
                                    return `<tr>
                                        <td class="mono" style="text-transform:capitalize;">${l.product}</td>
                                        <td class="mono">${l.edition || '—'} ${l.version || ''}</td>
                                        <td>${l.channel || '—'}</td>
                                        <td><span class="badge-status ${lBadge}">${l.license_status || '—'}</span></td>
                                        <td class="mono">${l.partial_product_key || '—'}</td>
                                    </tr>`;
                                }).join('') : '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-muted)">Sem dados de licença</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Acesso Remoto -->
                <div class="panel animate-in animate-in-delay-3" style="margin-bottom:20px;">
                    <div class="panel-header"><span class="panel-title">🖥️ Acesso Remoto</span></div>
                    <div class="panel-body">
                        <table class="data-table">
                            <tbody>
                                ${(() => {
                                    const ra = data.remote_access;
                                    if (!ra) return '<tr><td colspan="2" style="text-align:center;padding:20px;color:var(--text-muted)">Sem dados de acesso remoto — execute uma coleta</td></tr>';
                                    let rows = '';
                                    // AnyDesk
                                    if (ra.anydesk_id) {
                                        rows += `<tr>
                                            <td style="width:200px;color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:0.08em;">AnyDesk ID</td>
                                            <td><span class="mono" style="font-size:18px;font-weight:600;color:var(--accent);letter-spacing:0.05em;">${ra.anydesk_id}</span>
                                                ${ra.anydesk_alias ? `<span style="margin-left:12px;color:var(--text-muted);font-size:12px;">(${ra.anydesk_alias})</span>` : ''}
                                                ${ra.anydesk_version ? `<span style="margin-left:8px;color:var(--text-muted);font-size:11px;">v${ra.anydesk_version}</span>` : ''}
                                            </td>
                                        </tr>`;
                                    } else {
                                        rows += `<tr><td style="color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:0.08em;">AnyDesk</td><td style="color:var(--text-muted);">Não detectado</td></tr>`;
                                    }
                                    // UltraVNC
                                    if (ra.ultravnc_installed) {
                                        const ip = (data.network && data.network.length > 0 && data.network[0].ip) ? data.network[0].ip.split(',')[0] : h.hostname;
                                        const port = ra.ultravnc_port || 5900;
                                        rows += `<tr>
                                            <td style="color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:0.08em;">UltraVNC</td>
                                            <td><span class="badge-status badge-success" style="margin-right:8px;">Instalado</span>
                                                <span class="mono" style="font-size:13px;">${ip}:${port}</span>
                                                ${ra.ultravnc_version ? `<span style="margin-left:8px;color:var(--text-muted);font-size:11px;">v${ra.ultravnc_version}</span>` : ''}
                                            </td>
                                        </tr>`;
                                    } else {
                                        rows += `<tr><td style="color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:0.08em;">UltraVNC</td><td style="color:var(--text-muted);">Não instalado</td></tr>`;
                                    }
                                    return rows;
                                })()}
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Software -->
                <div class="panel animate-in animate-in-delay-4" style="margin-bottom:20px;">
                    <div class="panel-header">
                        <span class="panel-title">Softwares Instalados</span>
                        <span style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono);">${data.software ? data.software.length : 0} itens</span>
                    </div>
                    <div class="panel-body">
                        <table class="data-table">
                            <thead><tr><th>Nome</th><th>Versão</th><th>Editora</th><th>Instalação</th></tr></thead>
                            <tbody>
                                ${data.software && data.software.length > 0 ? data.software.map(sw => `<tr>
                                    <td class="mono">${sw.name || '—'}</td>
                                    <td>${sw.version || '—'}</td>
                                    <td>${sw.publisher || '—'}</td>
                                    <td>${sw.install_date || '—'}</td>
                                </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text-muted)">Sem dados de software</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            `;
        }

        loadHost();

        async function runDetailAction(action) {
            const btnMap = { 'ping': 'btn-ping', 'test-winrm': 'btn-test-winrm', 'enable-winrm': 'btn-enable-winrm', 'collect': 'btn-collect' };
            const actionBtn = document.getElementById(btnMap[action]);
            const resultEl = document.getElementById('action-result');
            const labels = { 'ping': '📡 Testar Ping', 'test-winrm': '🔌 Testar WinRM', 'enable-winrm': '⚡ Ativar WinRM', 'collect': '🔄 Coletar Dados' };

            if (actionBtn) {
                actionBtn.disabled = true;
                actionBtn.innerHTML = '<span class="spinner"></span>' + (labels[action] || action);
            }

            const isCollect = action === 'collect';

            if (isCollect) {
                // SSE: coleta com console visual
                runCollectStream(resultEl, actionBtn, labels);
                return;
            }

            resultEl.style.display = 'block';
            resultEl.innerHTML = '<div class="action-result loading">⏳ Executando...</div>';

            try {
                const res = await apiFetch(`/api/hosts/${hostId}/action/${action}`, { method: 'POST' });
                if (!res) {
                    resultEl.innerHTML = '<div class="action-result error">✗ Erro de conexão com a API</div>';
                    return;
                }
                const data = await res.json();
                if (data.success) {
                    let debugHtml = '';
                    if (data.debug && data.debug.length > 0) {
                        debugHtml = `<div style="margin-top:6px;font-size:11px;color:var(--text-muted);font-family:var(--font-mono);background:var(--bg-dark,#1a1a2e);padding:6px 10px;border-radius:4px;">${data.debug.map(d => `<div>${d}</div>`).join('')}</div>`;
                    }
                    resultEl.innerHTML = `<div class="action-result success">✓ ${data.message}${debugHtml}</div>`;
                } else {
                    let debugHtml = '';
                    if (data.debug && data.debug.length > 0) {
                        debugHtml = `<div style="margin-top:6px;font-size:11px;color:var(--text-muted);font-family:var(--font-mono);background:var(--bg-dark,#1a1a2e);padding:6px 10px;border-radius:4px;">${data.debug.map(d => `<div>${d}</div>`).join('')}</div>`;
                    }
                    resultEl.innerHTML = `<div class="action-result error">✗ ${data.message}${debugHtml}</div>`;
                }
            } catch (err) {
                resultEl.innerHTML = `<div class="action-result error">✗ ${err.message}</div>`;
            }

            if (actionBtn) {
                actionBtn.disabled = false;
                actionBtn.textContent = labels[action] || action;
            }

            setTimeout(() => { resultEl.style.display = 'none'; }, 20000);
        }

        async function runCollectStream(resultEl, actionBtn, labels) {
            resultEl.style.display = 'block';
            resultEl.innerHTML = `
                <div class="collect-console">
                    <div class="console-header">
                        <div class="console-dot" style="background:#f85149;"></div>
                        <div class="console-dot" style="background:#d29922;"></div>
                        <div class="console-dot" style="background:#3fb950;"></div>
                        <span>Tabularium — Coleta Remota</span>
                    </div>
                    <div class="console-body" id="console-output"></div>
                </div>`;

            const output = document.getElementById('console-output');
            let hasError = false;

            function ts() {
                const d = new Date();
                return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
            }

            function addLine(cls, msg) {
                const line = document.createElement('div');
                line.className = `console-line ${cls}`;
                line.innerHTML = `<span class="timestamp">[${ts()}]</span>${msg}`;
                output.appendChild(line);
                output.scrollTop = output.scrollHeight;
            }

            try {
                const res = await fetch(`/api/hosts/${hostId}/action/collect-stream`, {
                    headers: { ...authHeaders() },
                });

                if (!res.ok) {
                    addLine('error', `✗ Erro HTTP ${res.status}`);
                    return;
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // keep incomplete line

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                switch (data.type) {
                                    case 'start':
                                        addLine('step', `Iniciando coleta: ${data.hostname}`);
                                        break;
                                    case 'step':
                                        addLine('step', data.message);
                                        break;
                                    case 'step_progress':
                                        addLine('ok', data.message);
                                        break;
                                    case 'step_ok':
                                        addLine('ok', data.message);
                                        break;
                                    case 'step_warn':
                                        addLine('warn', data.message);
                                        break;
                                    case 'step_fail':
                                        addLine('fail', data.message);
                                        hasError = true;
                                        break;
                                    case 'error':
                                        addLine('error', data.message);
                                        hasError = true;
                                        break;
                                    case 'done':
                                        addLine('done', data.message);
                                        // Recarrega página após 3s
                                        setTimeout(() => { loadHost(); resultEl.style.display = 'none'; }, 3000);
                                        break;
                                }
                            } catch (e) {
                                // ignore parse errors
                            }
                        }
                    }
                }
            } catch (err) {
                addLine('error', `✗ Erro: ${err.message}`);
            }

            if (actionBtn) {
                actionBtn.disabled = false;
                actionBtn.textContent = labels['collect'];
            }
        }
    </script>
</body>
</html>
